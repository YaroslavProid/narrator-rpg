<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Narrator RPG</title>
<style>
:root{--bg:#121214;--pn:#1c1c21;--tx:#e6e3dc;--mu:#8c8a85;--ac:#c9a25b;--sp:#9fd0ff;--sy:#7fd18b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{display:flex;gap:.5rem;align-items:center;padding:.5rem .75rem;background:var(--pn);border-bottom:1px solid #2a2a30}
header h1{font-size:1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{background:#2b2b33;color:var(--tx);border:1px solid #3a3a44;border-radius:8px;padding:.5rem .8rem;font-size:.95rem}
button.pri{background:var(--ac);color:#111;border:0}button:disabled{opacity:.5}
main{flex:1;overflow:hidden;display:flex;position:relative}
#chat{flex:1;overflow-y:auto;padding:.75rem;scroll-behavior:smooth}
.m{margin:.35rem 0;white-space:pre-wrap}.narration{font-style:italic;color:#d8d2c4}.speech b{color:var(--sp)}
.player{color:var(--ac);border-left:3px solid var(--ac);padding-left:.5rem}.system,.roll{background:#16241a;color:var(--sy);border-radius:8px;padding:.4rem .6rem;font-family:ui-monospace,monospace;font-size:.85rem}
.turnstat{color:var(--mu);font-size:.7rem;text-align:right}
#side{width:min(320px,85vw);background:var(--pn);border-left:1px solid #2a2a30;overflow-y:auto;padding:.75rem;position:absolute;right:0;top:0;bottom:0;transform:translateX(100%);transition:.2s}
#side.open{transform:none}#side h3{margin:.6rem 0 .2rem;font-size:.95rem;color:var(--ac)}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%}
footer{display:flex;gap:.4rem;padding:.5rem;background:var(--pn);border-top:1px solid #2a2a30;padding-bottom:max(.5rem,env(safe-area-inset-bottom))}
textarea,input,select{background:#0e0e10;color:var(--tx);border:1px solid #3a3a44;border-radius:8px;padding:.5rem;font:inherit;width:100%}
footer textarea{flex:1;resize:none;height:2.6rem}
.view{display:none;flex:1;overflow-y:auto;padding:1rem}.view.on{display:block}
.card{background:var(--pn);border-radius:10px;padding:.75rem;margin:.5rem 0}label{display:block;margin:.5rem 0 .2rem;color:var(--mu);font-size:.85rem}
.npc{border:1px dashed #3a3a44;border-radius:8px;padding:.5rem;margin:.5rem 0}
.row{display:flex;gap:.5rem;flex-wrap:wrap}.hint{color:var(--mu);font-size:.8rem}
</style></head><body>
<header><button id="bBack" onclick="showList()">☰</button><h1 id="title">Narrator RPG</h1><button id="bSide" onclick="side.classList.toggle('open')">📊</button></header>

<div id="vList" class="view on">
  <div class="row"><button class="pri" onclick="showNew()">+ Новая сцена</button><button onclick="loadList()">↻</button></div>
  <div id="list"></div>
</div>

<div id="vNew" class="view">
  <div class="card">
    <label>Название</label><input id="nTitle" value="Таверна «Серый Брод»">
    <label>Сеттинг / лор</label><textarea id="nSetting" rows="4">Мрачное фэнтези. Пограничный городок у болот, дождь, долги и контрабанда.</textarea>
    <label>Режим правил (выбирается один раз)</label>
    <select id="nMode"><option value="d20">d20 — проверки с бросками</option><option value="система">Система — только статы, без бросков</option></select>
  </div>
  <div class="card"><b>Ваш персонаж</b>
    <label>Имя</label><input id="pName" value="Ярен">
    <label>Описание</label><textarea id="pDesc" rows="3">Бывший наёмник, ищет пропавший караван брата.</textarea>
    <label>Атрибуты (Сила Ловкость Телосложение Интеллект Мудрость Харизма)</label><input id="pAttrs" value="12 14 12 10 12 11">
    <label>Навыки (Навык=уровень, через запятую)</label><input id="pSkills" value="Скрытность=2, Ближний бой=2, Восприятие=1">
    <label>Инвентарь (через запятую)</label><input id="pInv" value="Короткий меч, Нож, Кошель с 12 серебряными">
  </div>
  <div class="card"><b>Стартовые NPC</b> <span class="hint">вставьте текст/JSON карточки или загрузите PNG/JSON (SillyTavern V2/V3)</span>
    <div id="npcs"></div><button onclick="addNpc()">+ NPC</button>
  </div>
  <div class="row"><button class="pri" onclick="createScene()">Создать</button><button onclick="showList()">Отмена</button></div>
</div>

<main id="vGame" style="display:none">
  <div id="chat"></div>
  <aside id="side"></aside>
</main>
<footer id="foot" style="display:none">
  <textarea id="inp" placeholder="Ваше действие… («Система, статус»)"></textarea>
  <button class="pri" id="bSend" onclick="send()">➤</button>
  <button id="bCont" onclick="cont()" title="Продолжить">Продолжить</button>
  <button onclick="sysCmd()" title="Система">⚙</button>
</footer>
<script>
const $=id=>document.getElementById(id), side=$('side'), chat=$('chat');
let ws=null, scene=null, busy=false, segs={};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function view(v){for(const x of ['vList','vNew'])$(x).classList.toggle('on',x==v);
  const g=v=='vGame';$('vGame').style.display=g?'flex':'none';$('foot').style.display=g?'flex':'none';$('bSide').style.display=g?'':'none'}
async function loadList(){const r=await (await fetch('api/scenes')).json();
  $('list').innerHTML=r.length?r.map(s=>`<div class="card" onclick="openScene('${s.id}')"><b>${esc(s.title)}</b><div class="hint">${s.rule_mode} · ход ${s.turn} · ${s.updated}</div></div>`).join(''):'<p class="hint">Сцен пока нет.</p>'}
function showList(){if(ws){ws.close();ws=null}$('title').textContent='Narrator RPG';view('vList');loadList()}
function showNew(){view('vNew');if(!$('npcs').children.length){addNpc('Сильфа','Хозяйка таверны, острая на язык, торгует слухами.');addNpc('Борек','Хмурый наёмник у камина, что-то скрывает.')}}
function addNpc(n='',d=''){const el=document.createElement('div');el.className='npc';
  el.innerHTML=`<input class="nn" placeholder="Имя" value="${esc(n)}"><label>Описание или карточка (текст/JSON)</label><textarea class="nd" rows="3">${esc(d)}</textarea>
  <div class="row"><input type="file" class="nf" accept=".png,.json,.txt" style="width:auto"><button onclick="this.closest('.npc').remove()">✕</button></div>`;
  el.querySelector('.nf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);
    const r=await fetch('api/cards/parse',{method:'POST',body:fd});const c=await r.json();if(!r.ok)return alert(c.detail);
    el.querySelector('.nn').value=c.name;el.querySelector('.nd').value=[c.description,c.personality&&('Характер: '+c.personality)].filter(Boolean).join('\n');el.dataset.speech=c.speech||''};
  $('npcs').appendChild(el)}
async function createScene(){const names=['Сила','Ловкость','Телосложение','Интеллект','Мудрость','Харизма'];
  const av=$('pAttrs').value.trim().split(/\s+/).map(Number),attrs={};names.forEach((n,i)=>{if(av[i])attrs[n]=av[i]});
  const skills={};$('pSkills').value.split(',').forEach(x=>{const[k,v]=x.split('=');if(k&&k.trim())skills[k.trim()]=+v||1});
  const npcs=[...document.querySelectorAll('.npc')].map(e=>{const d=e.querySelector('.nd').value.trim();
    return d.startsWith('{')?{name:e.querySelector('.nn').value,card:d}:{name:e.querySelector('.nn').value.trim(),description:d,speech:e.dataset.speech||''}}).filter(n=>n.name||n.card);
  const body={title:$('nTitle').value,setting:$('nSetting').value,rule_mode:$('nMode').value,
    player:{name:$('pName').value,description:$('pDesc').value,attrs,skills,inventory:$('pInv').value.split(',').map(s=>s.trim()).filter(Boolean)},npcs};
  const r=await fetch('api/scenes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();
  if(!r.ok)return alert(j.detail);openScene(j.id)}
function add(kind,text,who,id){const d=document.createElement('div');d.className='m '+kind;if(id)d.dataset.id=id;
  setText(d,kind,text,who);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function setText(d,kind,text,who){d.className='m '+kind;d.innerHTML=kind=='speech'?`<b>${esc(who)}:</b> ${esc(text)}`:kind=='narration'?esc(text):esc(text)}
async function openScene(id){const s=await (await fetch('api/scenes/'+id)).json();scene=s;$('title').textContent=s.title+' · '+s.rule_mode;view('vGame');
  chat.innerHTML='';for(const e of s.log){add(e.kind,e.text,e.who)}renderSide(s.state);
  const proto=location.protocol=='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}${location.pathname.replace(/\/$/,'')}/ws/${id}`);
  ws.onmessage=ev=>onMsg(JSON.parse(ev.data));ws.onclose=()=>{if(scene)setBusy(false)}}
function onMsg(m){
  if(m.type=='hello')return renderSide(m.state);
  if(m.type=='player')return add('player',m.text);
  if(m.type=='continue')return add('player','⏵ Продолжить');
  if(m.type=='chunk'){let d=segs[m.id];if(!d){d=segs[m.id]=add(m.kind,'',m.who,m.id);d._t=''}d._t+=m.delta;setText(d,m.kind,d._t,m.who);chat.scrollTop=chat.scrollHeight;return}
  if(m.type=='retract'){segs[m.id]?.remove();delete segs[m.id];return}
  if(m.type=='replace'){const d=segs[m.id];if(!d)return;const ref=d;for(const s of m.segments){const n=document.createElement('div');setText(n,s.kind,s.text,s.who);ref.before(n)}d.remove();delete segs[m.id];return}
  if(m.type=='segment')return add(m.kind,m.text,m.who);
  if(m.type=='turn_end'){renderSide(m.state);const s=m.stats;if(s.llm_calls&&s.llm_calls.length){const t=document.createElement('div');t.className='turnstat';
    t.textContent=`ход ${s.turn}: ${s.wall_s} c · вызовов ${s.llm_calls.length} · кэш ${s.cache_n} / перечитано ${s.prompt_n} ток.`;chat.appendChild(t)}setBusy(false);return}
  if(m.type=='error'){add('system','Ошибка: '+m.text);setBusy(false)}}
function setBusy(b){busy=b;$('bSend').disabled=b;$('bCont').disabled=b}
function send(){const t=$('inp').value.trim();if(!t||busy||!ws)return;ws.send(JSON.stringify({type:'input',text:t}));$('inp').value='';setBusy(true)}
function cont(){if(busy||!ws)return;ws.send(JSON.stringify({type:'continue'}));setBusy(true)}
function sysCmd(){const c=prompt('Команда Системы','статус');if(c){$('inp').value='Система, '+c;send()}}
$('inp').addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function bar(c,m,col){return `<div class="bar"><i style="width:${m?Math.round(100*c/m):0}%;background:${col}"></i></div>`}
function renderSide(st){if(!st)return;const p=st.characters[st.player_id];let h=`<div class="hint">Режим: ${st.rule_mode} · ход ${st.turn}</div>`;
  const ch=c=>`<h3>${esc(c.name)}${c.is_player?' (вы)':''} · ур. ${c.level}</h3>HP ${c.hp}/${c.max_hp}${bar(c.hp,c.max_hp,'#c55')}MP ${c.mp}/${c.max_mp}${bar(c.mp,c.max_mp,'#58c')}`;
  h+=ch(p)+`EXP ${p.exp}/${p.exp_next}${bar(p.exp,p.exp_next,'#cb5')}<div class="hint">${Object.entries(p.attrs).map(([k,v])=>k+' '+v).join(' · ')}</div>`;
  h+=`<h3>Навыки</h3>${Object.entries(p.skills).map(([k,v])=>esc(k)+' '+v).join('<br>')||'—'}<h3>Инвентарь</h3>${p.inventory.map(i=>esc(i.name)+(i.qty>1?' ×'+i.qty:'')).join('<br>')||'—'}`;
  h+='<h3>В сцене</h3>'+st.present.filter(i=>i!=st.player_id).map(i=>{const c=st.characters[i];return esc(c.name)+` <span class="hint">HP ${c.hp}/${c.max_hp}</span>`}).join('<br>');
  side.innerHTML=h}
view('vList');loadList();
</script></body></html>
